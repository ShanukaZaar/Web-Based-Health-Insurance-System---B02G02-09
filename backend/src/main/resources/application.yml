# Spring Boot Application Configuration
server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /

spring:
  application:
    name: health-insurance-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 Console configuration for testing (accessible at /h2-console in dev)
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.mlbb2g209.healthinsurance: DEBUG
