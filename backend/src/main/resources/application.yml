# Spring Boot Application Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: health-insurance-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:healthdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 Console configuration for testing (accessible at /h2-console in dev)
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.mlbb2g209.healthinsurance: DEBUG
